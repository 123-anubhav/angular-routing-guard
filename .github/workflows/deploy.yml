
name: Deploy Angular Routing Guard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Angular application
        run: npx ng build --configuration production --base-href /angular-routing-guard/

      - name: Verify Angular output
        run: |
          ls -la dist/angular-routing-gurad/browser
          test -f dist/angular-routing-gurad/browser/index.html

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/angular-routing-gurad/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
